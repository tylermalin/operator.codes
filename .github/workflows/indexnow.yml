name: IndexNow

# After Vercel finishes a production deploy, submit the sitemap's URLs
# so IndexNow engines recrawl new and updated pages right away.
on:
  deployment_status:

jobs:
  submit:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs
